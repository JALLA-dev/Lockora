<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield -->
  <path d="M60 10 L102 28 V64 C102 88 82 106 60 114 C38 106 18 88 18 64 V28 Z" fill="url(#shieldBg)" stroke="url(#shieldBorder)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Tech Grid Background -->
  <g stroke="#6366F1" stroke-width="1.5" opacity="0.25">
    <line x1="40" y1="20" x2="40" y2="100" />
    <line x1="80" y1="20" x2="80" y2="100" />
    <line x1="20" y1="45" x2="100" y2="45" />
    <line x1="20" y1="85" x2="100" y2="85" />
  </g>

  <!-- L-Shape Circuit -->
  <path d="M44 42 V74 H68" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Encrypted Nodes -->
  <circle cx="44" cy="42" r="5" fill="#34D399" />
  <circle cx="44" cy="74" r="5" fill="#34D399" />
  <circle cx="68" cy="74" r="5" fill="#34D399" />
  
  <!-- Lock Core (Keyhole) integrated inside -->
  <path d="M60 48 A 7 7 0 1 0 60 62 A 7 7 0 0 0 60 48 Z" fill="#F8FAFC" />
  <path d="M56 58 H64 V70 H56 Z" fill="#F8FAFC" />
</svg>
